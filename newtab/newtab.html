<!doctype html>
<html lang="en" data-focusbridge-newtab="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="newtab.css">
</head>
<body aria-busy="true">
  <div id="rainbow-scene" class="rainbow-scene" aria-hidden="true"></div>
  <button id="appearance-toggle" class="appearance-toggle" type="button" aria-label="Switch to day mode" aria-pressed="false">☼</button>
  <main id="focus-page" aria-label="FocusBridge homepage">
    <section class="clock-row" aria-label="Local and world times">
      <div class="world-clock world-clock-left">
        <time id="left-clock"></time>
        <div class="timezone-picker">
          <input id="left-timezone" type="text" autocomplete="off" placeholder="Choose city or zone" aria-label="Left world clock location">
          <div id="left-timezone-results" class="timezone-results" role="listbox" hidden></div>
        </div>
      </div>
      <time id="clock" class="clock" aria-label="Your local time"></time>
      <div class="world-clock world-clock-right">
        <time id="right-clock"></time>
        <div class="timezone-picker">
          <input id="right-timezone" type="text" autocomplete="off" placeholder="Choose city or zone" aria-label="Right world clock location">
          <div id="right-timezone-results" class="timezone-results" role="listbox" hidden></div>
        </div>
      </div>
    </section>

    <section class="hero" aria-label="Today's focus">
      <h1 id="greeting">Good day</h1>
      <div class="goal-start">
        <input id="goal-input" class="goal-input" type="text" maxlength="180" autocomplete="off"
          placeholder="What's your focus today?" aria-label="Today's focus goal">
        <button id="start-focus-session" type="button" title="Start focus session" aria-label="Start focus session">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="focus-arrow" d="M5 12h13M13 6l6 6-6 6"/><path class="focus-close" d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="pomodoro-presets" class="pomodoro-presets" role="group" aria-label="Start a Pomodoro timer">
        <span class="pomodoro-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M12 3v3M7 6h10M18 9.5A8 8 0 1 1 6 9.5M17.5 4.5l1.5-1.5"/></svg>Pomodoro</span>
        <button type="button" class="pomo-preset" data-minutes="15">15</button>
        <button type="button" class="pomo-preset" data-minutes="25">25</button>
        <button type="button" class="pomo-preset" data-minutes="35">35</button>
        <button type="button" class="pomo-preset" data-minutes="45">45</button>
      </div>
      <form id="search-form" class="search-form" role="search">
        <label class="sr-only" for="search-input">Search Google</label>
        <input id="search-input" type="search" autocomplete="off" placeholder="Search Google or type a URL" aria-label="Search Google or type a URL">
        <div class="search-actions" aria-label="Search tools">
          <button id="quick-focus" type="button" title="Set focus" aria-label="Set focus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <button id="voice-search" type="button" title="Voice search" aria-label="Voice search"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>
          <button id="focus-search" type="button" title="Focus search" aria-label="Focus search"><svg viewBox="0 0 24 24"><path d="M12 3 14.5 9.5 21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg></button>
        </div>
      </form>
    </section>

    <p id="focus-stat" class="focus-stat" aria-live="polite"></p>
    <nav id="shortcuts" class="shortcuts" aria-label="Most visited sites" hidden></nav>
  </main>
  <section id="homepage-checklist" class="homepage-checklist" aria-label="Quick checklist">
    <div id="checklist-rows" class="checklist-rows"></div>
    <form id="checklist-add-form" class="checklist-add-form">
      <input id="checklist-add-input" type="text" maxlength="40" autocomplete="off" placeholder="Add a stickpost" aria-label="Add a checklist task">
      <button id="checklist-add-button" type="submit" title="Add task" aria-label="Add task"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
  </section>

  <button id="drawer-toggle" class="drawer-toggle" type="button" aria-controls="detail-drawer" aria-expanded="false" aria-label="Open focus details">⌃</button>
  <aside id="detail-drawer" class="detail-drawer" aria-label="Focus details" aria-hidden="true">
    <div class="drawer-content">
      <p class="drawer-kicker">FocusBridge</p>
      <p id="buddy-status" class="drawer-line"></p>
      <p id="week-summary" class="drawer-line"></p>
      <p id="blueprint" class="blueprint"></p>
    </div>
  </aside>

  <script src="quotes.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
